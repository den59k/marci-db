
[workspace]
resolver = "3"
# Every crate lives under crates/. The glob picks up new crates automatically — no need to list them here.
members = ["crates/*"]

default-members = [
    "crates/marcidb",
    "crates/marcidb-server"
]

# Single source of truth for the version across every crate (engine, ffi, codegen, server, index modules).
# Each member sets `version.workspace = true`; `scripts/release.sh` bumps this one line. Keep it in lockstep with the
# npm packages (marcidb-client, marcidb-embedded) so "same version == compatible" holds across the toolchain.
[workspace.package]
version = "0.11.4"
