[package]
name = "marci_vector_index"
version = "0.1.0"
edition = "2024"

# Adapter bridging the pure `marci_vector` algorithm to MarciDB's `IndexProvider` SPI.
# Depends on both; `marci_vector` itself stays free of any MarciDB dependency.
[dependencies]
marcidb = { path = "../marcidb" }
marci_vector = { path = "../marci-vector" }
serde_json = "1.0.145"

[dev-dependencies]
tempfile = "3.26.0"
