[package]
name = "marci-db-server"
version = "0.1.0"
edition = "2024"

[dependencies]
http-body-util = "0.1.3"
hyper = "1.7.0"
tokio = { version = "1", features = ["full"] }
hyper-util = { version = "0.1.17", features = ["http1", "server", "tokio"] }
serde_json = "1.0.145"
marcidb = { path = "../marcidb" }
marci_vector = { path = "../marci-vector", optional = true }
chrono = "0.4.42"

[features]
marci_vector=[ "dep:marci_vector" ]