[package]
name = "marcidb-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "marcidb-server"
path = "src/main.rs"

[dependencies]
http-body-util = "0.1.3"
hyper = "1.7.0"
tokio = { version = "1", features = ["full"] }
hyper-util = { version = "0.1.17", features = ["http1", "server", "tokio"] }
serde_json = "1.0.145"
marcidb = { path = "../marcidb" }
# marci_vector = { path = "../marci-vector", optional = true }
chrono = "0.4.42"

# [features]
# marci_vector=[ "dep:marci_vector" ]

[dev-dependencies]
tempfile = "3.8"
reqwest = { version = "0.11", features = ["json"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread"] }