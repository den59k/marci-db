[package]
name = "marcidb"
version.workspace = true
edition = "2024"

[dependencies]
bitvec = "1.0.1"
canopydb = "0.2.5"
chrono = "0.4.42"
memchr = "2.8.0"
serde_json = "1.0.145"
# Foundation: schema model + parser + snapshot codec + migration authoring. The engine builds on it.
marcidb-schema = { path = "../marcidb-schema" }

[dev-dependencies]
tempfile = "3.26.0"

[[bench]]
name = "include_cache"
harness = false

[dependencies.smallvec]
version = "=2.0.0-alpha.12"
