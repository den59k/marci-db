[package]
name = "marcidb-server"
version.workspace = true
edition = "2024"

[dependencies]
# The HTTP API itself (routing, handlers, backups, the accept loop); this binary is config and banner.
marcidb-http = { path = "../marcidb-http" }
tokio = { version = "1", features = ["full"] }

[features]
# Enable `@custom(vector, …)` indexes: `cargo run -p marcidb-server --features vector`
vector = ["marcidb-http/vector"]
# Enable `@custom(fulltext, …)` indexes: `cargo run -p marcidb-server --features fulltext`
fulltext = ["marcidb-http/fulltext"]
