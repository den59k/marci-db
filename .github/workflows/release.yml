name: Release

# Fires when a vX.Y.Z tag is pushed (release.sh does that for you).
# Builds the Windows .exe and Linux server binaries in two flavours — full (vector
# + full-text) and core — plus the embedded marcidb-ffi native libraries (full) and
# the marci-generate/marci-migrate codegen binaries for Windows, Linux and macOS,
# builds & pushes the Docker images to GHCR, and publishes a GitHub Release with an
# auto-generated changelog.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.2.3). Must already exist."
        required: true

permissions:
  contents: write # create the GitHub Release
  packages: write # push images to GHCR

env:
  # Resolve the tag from either trigger.
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # -------- changelog notes for the release body --------
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history + tags to diff against the previous tag
      - name: Generate release notes
        shell: bash
        run: |
          prev_tag="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "$prev_tag" ]; then range="${prev_tag}..${TAG}"; else range="${TAG}"; fi
          echo "Changelog range: $range"
          bash scripts/gen-changelog.sh "$range" > RELEASE_NOTES.md
          cat RELEASE_NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md

  # -------- native binaries: {windows, linux} x {full, core} --------
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            variant: full
            features: "vector fulltext"
            toolchain: nightly
            ext: ".exe"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            variant: core
            features: ""
            toolchain: stable
            ext: ".exe"
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            variant: full
            features: "vector fulltext"
            toolchain: nightly
            ext: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            variant: core
            features: ""
            toolchain: stable
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (${{ matrix.toolchain }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.variant }}
      - name: Build marcidb-server (${{ matrix.variant }})
        shell: bash
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo build --release --locked -p marcidb-server --target ${{ matrix.target }} --features "${{ matrix.features }}"
          else
            cargo build --release --locked -p marcidb-server --target ${{ matrix.target }}
          fi
      - name: Package binary
        shell: bash
        run: |
          os="${{ matrix.os == 'windows-latest' && 'windows' || 'linux' }}"
          out="marcidb-server-${TAG}-x86_64-${os}-${{ matrix.variant }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/marcidb-server${{ matrix.ext }}" "$out"
          echo "ASSET=$out" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}-${{ matrix.variant }}
          path: ${{ env.ASSET }}

  # -------- embedded native libs (marcidb-ffi, full) for marcidb-embedded: {windows, linux, mac} --------
  # The full variant (vector + full-text) needs nightly. Each asset is named exactly as the loader
  # (packages/marcidb-embedded/src/loader.ts) expects, so it can be dropped into the package's native/
  # directory or pointed at via the MARCIDB_LIB env var.
  embedded:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            libfile: marcidb_ffi.dll
            asset: marcidb-win32-x64.dll
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            libfile: libmarcidb_ffi.so
            asset: marcidb-linux-x64.so
          - os: macos-latest
            target: aarch64-apple-darwin
            libfile: libmarcidb_ffi.dylib
            asset: marcidb-darwin-arm64.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-embedded
      - name: Build marcidb-ffi (full)
        shell: bash
        # Default features are vector + fulltext, so no --features flag is needed.
        run: cargo build --release --locked -p marcidb-ffi --target ${{ matrix.target }}
      - name: Package library
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/${{ matrix.libfile }}" "${{ matrix.asset }}"
          echo "ASSET=${{ matrix.asset }}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: embedded-${{ matrix.os }}
          path: ${{ env.ASSET }}

  # -------- codegen binaries (marci-generate + marci-migrate) for marcidb-client: {windows, linux, mac} --------
  # These ship in the npm package's bin/ and are resolved per-platform by packages/marcidb-client/bin.js, so
  # the asset names match exactly what it expects (`marci-generate-<suffix>`, `marci-migrate-<suffix>`). The
  # codegen path doesn't pull the vector module, so a stable toolchain suffices (no nightly).
  codegen:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: win32-x64
            ext: ".exe"
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x64
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: darwin-arm64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-codegen
      - name: Build marci-generate + marci-migrate
        shell: bash
        # marci-generate is the marcidb-ts binary; marci-migrate is the marcidb-migrate binary (renamed in
        # its Cargo.toml). Same mapping as packages/marcidb-client/build-binary.sh.
        run: cargo build --release --locked -p marcidb-ts -p marcidb-migrate --target ${{ matrix.target }}
      - name: Package binaries
        shell: bash
        run: |
          mkdir -p out
          cp "target/${{ matrix.target }}/release/marcidb-ts${{ matrix.ext }}"    "out/marci-generate-${{ matrix.suffix }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/marci-migrate${{ matrix.ext }}" "out/marci-migrate-${{ matrix.suffix }}${{ matrix.ext }}"
      - uses: actions/upload-artifact@v4
        with:
          name: codegen-${{ matrix.os }}
          path: out/*

  # -------- publish the npm packages (marcidb-client, marcidb-embedded) --------
  # Assembles EVERY platform's codegen binaries + native libs into the package dirs, builds the JS bundles,
  # then publishes both with NPM_TOKEN — so one tag ships all platforms (mac included) without hand-committing
  # binaries. Runs after the per-OS build jobs. `release.sh` stamps the version into the tagged commit, so the
  # checked-out package.json already carries the right version.
  publish-npm:
    needs: [embedded, codegen]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }} # always the tagged commit (its package.json carries the stamped version)
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org" # writes the .npmrc that reads NODE_AUTH_TOKEN

      # All platforms' artifacts → the package dirs. merge-multiple flattens the per-OS artifacts into one dir;
      # the copy overwrites the committed win/linux binaries with fresh builds and adds mac.
      - uses: actions/download-artifact@v4
        with: { pattern: "codegen-*", path: dl-codegen, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { pattern: "embedded-*", path: dl-embedded, merge-multiple: true }
      - name: Stage artifacts into the packages
        run: |
          mkdir -p packages/marcidb-client/bin packages/marcidb-embedded/native
          cp dl-codegen/*  packages/marcidb-client/bin/
          cp dl-embedded/* packages/marcidb-embedded/native/
          chmod +x packages/marcidb-client/bin/*   # restore the exec bit (artifact upload drops it)

      # Build the JS bundles (dist + runtime). bunx fetches bunup; no install needed.
      - name: Build JS bundles
        run: |
          ( cd packages/marcidb-client  && bunx bunup src/index.ts --external .marcidb/client --out-dir runtime )
          ( cd packages/marcidb-embedded && bunx bunup src/index.ts --external koffi --external bun:ffi --out-dir dist )

      # Publish client first (embedded peer-depends on it). --ignore-scripts because dist/runtime are already
      # built here (prepublishOnly would re-run bunup, which isn't installed).
      - name: Publish marcidb-client
        working-directory: packages/marcidb-client
        run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish marcidb-embedded
        working-directory: packages/marcidb-embedded
        run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # -------- Docker images: {full, core} -> GHCR --------
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            features: "vector fulltext"
            rust_image: "rustlang/rust:nightly-bookworm"
            tags: "full,latest"
          - variant: core
            features: ""
            rust_image: "rust:bookworm"
            tags: "core"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          # lowercase the owner — GHCR repositories must be lowercase
          repo="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/marcidb-server"
          version="${TAG#v}"
          list="${repo}:${version}-${{ matrix.variant }}"
          IFS=',' read -ra extra <<< "${{ matrix.tags }}"
          for t in "${extra[@]}"; do list="${list},${repo}:${t}"; done
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "Tags: $list"
      - name: Build & push
        uses: docker/build-push-action@v6
        env:
          # Don't upload the ".dockerbuild" build-record artifact — it's unused and
          # downloading it later made the release job flaky.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          push: true
          build-args: |
            FEATURES=${{ matrix.features }}
            RUST_IMAGE=${{ matrix.rust_image }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

  # -------- publish the GitHub Release with notes + binaries --------
  release:
    needs: [changelog, binaries, embedded, codegen, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          # Only the server binaries, embedded libs, codegen binaries and release notes — never docker records.
          pattern: "{binary-*,embedded-*,codegen-*,release-notes}"
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body_path: artifacts/release-notes/RELEASE_NOTES.md
          files: |
            artifacts/binary-*/*
            artifacts/embedded-*/*
            artifacts/codegen-*/*
          fail_on_unmatched_files: true
