[package]
name = "marcidb"
version = "0.2.0"
edition = "2024"

[dependencies]
bitvec = "1.0.1"
canopydb = "0.2.5"
chrono = "0.4.42"
memchr = "2.8.0"
serde_json = "1.0.145"

[dev-dependencies]
tempfile = "3.26.0"
# Authoring layer (the migration diff engine). The engine's integration tests exercise diff/reconcile/
# serialize_migration. Dev-only dependency cycle (this crate depends on the engine) — allowed by Cargo.
marcidb-schema = { path = "../marcidb-schema" }

[[bench]]
name = "include_cache"
harness = false

[dependencies.smallvec]
version = "=2.0.0-alpha.12"
