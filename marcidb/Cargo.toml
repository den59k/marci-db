[package]
name = "marcidb"
version = "0.2.0"
edition = "2024"

[dependencies]
bitvec = "1.0.1"
canopydb = "0.2.5"
chrono = "0.4.42"
memchr = "2.8.0"
serde_json = "1.0.145"
serde = { version = "1", features = ["derive"] }
prisma-client-rust = { git = "https://github.com/Brendonovich/prisma-client-rust", tag = "0.6.11", default-features = false, features = ["postgresql"] }
prisma-client-rust-cli = { git = "https://github.com/Brendonovich/prisma-client-rust", tag = "0.6.11", default-features = false, features = ["postgresql"] }

[dev-dependencies]
criterion  = { version = "0.5", features = ["html_reports"] }
tokio      = { version = "1",   features = ["full"] }
serde_json = "1"
tempfile   = "3"
sysinfo = "0.31"

[dependencies.smallvec]
version = "=2.0.0-alpha.12"

[[bench]]
name    = "b1_insert_prisma"
harness = false

[[bench]]
name    = "b1_insert_marci"
harness = false

[[bench]]
name    = "b2_b7_read_prisma"
harness = false

[[bench]]
name    = "b2_b7_read_marci"
harness = false

[[bench]]
name    = "b8_delete_prisma"
harness = false

[[bench]]
name    = "b8_delete_marci"
harness = false

[[bench]]
name    = "b9_concurrent_prisma"
harness = false

[[bench]]
name    = "b9_concurrent_marci"
harness = false

[[bench]]
name = "b1_insert_once_marci"
harness = false

[[bench]]
name = "b1_insert_once_prisma"
harness = false

[[bench]]
name    = "b2_b7_read_once_marci"
harness = false

[[bench]]
name    = "b2_b7_read_once_prisma"
harness = false

[[bench]]
name    = "b8_delete_once_marci"
harness = false

[[bench]]
name    = "b8_delete_once_prisma"
harness = false

[[bench]]
name    = "b9_concurrent_once_marci"
harness = false

[[bench]]
name    = "b9_concurrent_once_prisma"
harness = false