[package]
name = "marci_fulltext_index"
version = "0.1.0"
edition = "2024"

# Full-text search index module for MarciDB's `@custom(fulltext, …)` SPI. Self-contained: a Snowball
# tokenizer/stemmer (English + Russian) over an on-disk inverted index. Stable toolchain — no nightly.
[dependencies]
marcidb = { path = "../marcidb" }
rust-stemmers = "1.2.0"
serde_json = "1.0.145"

[dev-dependencies]
tempfile = "3.26.0"
